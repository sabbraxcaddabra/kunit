# Original pre-audit JH-2 card: MAT RO=1.72 g/cm3, revised to the 1.717 g/cm3
# unreacted EOS/kinetics density reported by Awan et al. (2024), Tables 2-3.
# Product EOS and ENQ remain Zhu et al. (2022) values at 1.667 g/cm3.
# Hong et al. (2020), Tables 1-3 (DOI above), confirms positive reactant R2
# but gives no CVP/CVR. CVR uses the pure-RDX estimate in Cawkwell et al.
# (2016), p. 4, converted with NIST molar mass; CVP remains untraced.
# No complete same-density calibration has been found: see
# docs/lee_tarver/jh-2.md and docs/lee_tarver/source_search.md.
